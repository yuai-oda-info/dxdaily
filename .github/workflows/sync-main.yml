name: Sync main from claude/* session branch

# このリポジトリのGitHub Pagesは main ブランチへの push だけを検知してデプロイする。
# 日々の自動更新タスクは claude/... というセッション専用ブランチ（セッションごとに名前が変わる）
# へコミットするため、そのブランチが更新されたら自動的に main へも早送りマージして反映する。
# （2026-09-04: main への push 漏れでサイトが更新されない事故が発生したための再発防止策。
#  2026-09-19: ブランチ名を claude/keen-babbage-qncfrl に固定していたため、セッションのブランチ名が
#  変わると本ワークフローが一切発火せず、mainへの反映が数日分止まっていた事故が発生。
#  ブランチ名をワイルドカード化し、常に発火したブランチ自身をmainへ早送りするよう修正。）

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward main to ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge-base --is-ancestor origin/main "${{ github.ref_name }}"; then
            git merge --ff-only "${{ github.ref_name }}"
            git push origin main
          else
            echo "main has commits not present on ${{ github.ref_name }}; skipping automatic fast-forward to avoid overwriting them."
            exit 1
          fi
